server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-lived caching for fingerprinted build output and the image set, both
  # of which change name whenever their content changes.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location /img/ {
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
  }

  # Client-side routing: unknown paths are handed to the app, which renders
  # either the route or its own 404 page.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html itself must never be cached, or a deploy will not be picked up.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
